[project]
name = "moto-pricing"
version = "0.1.0"
description = "Full-lifecycle UK motorcycle insurance pricing: ensemble pricing models plus a quote-to-bind-to-renewal market simulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "burning-cost @ git+https://github.com/burningcost/burning-cost.git",
    "catboost>=1.2.7",
    "click>=8.1",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "shap>=0.46",
    "statsmodels>=0.14",
    "tabulate>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moto_pricing"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
